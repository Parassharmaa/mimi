<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Mimi local translation development benchmark</title>
  <desc id="description">Quality, model size, and latency comparison for base ElanMT, fine-tuned Mimi, and Apple Translation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 720; }
      .subtitle { fill: #94a3b8; font-size: 16px; }
      .card { fill: #111d32; stroke: #263653; stroke-width: 1; }
      .direction { fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .metric { fill: #cbd5e1; font-size: 15px; font-weight: 650; }
      .label { fill: #94a3b8; font-size: 13px; }
      .value { fill: #e2e8f0; font-size: 13px; font-weight: 650; }
      .note { fill: #cbd5e1; font-size: 15px; }
      .small { fill: #94a3b8; font-size: 13px; }
      .base { fill: #64748b; }
      .mimi { fill: #2dd4bf; }
      .apple { fill: #a78bfa; }
      .track { fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="850" rx="28" fill="url(#background)"/>
  <text x="54" y="62" class="title">Local translation development benchmark</text>
  <text x="54" y="92" class="subtitle">200 public cases, 100 per direction, including 40 six-segment documents</text>

  <circle cx="748" cy="60" r="7" class="base"/>
  <text x="762" y="65" class="label">Base ElanMT</text>
  <circle cx="894" cy="60" r="7" class="mimi"/>
  <text x="908" y="65" class="label">Mimi</text>
  <circle cx="982" cy="60" r="7" class="apple"/>
  <text x="996" y="65" class="label">Apple Translation</text>

  <g filter="url(#shadow)">
    <rect x="42" y="125" width="548" height="470" rx="22" class="card"/>
    <rect x="610" y="125" width="548" height="470" rx="22" class="card"/>
  </g>

  <text x="70" y="165" class="direction">English → Japanese</text>
  <text x="638" y="165" class="direction">Japanese → English</text>

  <text x="70" y="205" class="metric">chrF++</text>
  <rect x="150" y="187" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="187" width="141" height="14" rx="7" class="base"/>
  <text x="462" y="199" class="value">28.13</text>
  <rect x="150" y="211" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="211" width="142" height="14" rx="7" class="mimi"/>
  <text x="462" y="223" class="value">28.41</text>
  <rect x="150" y="235" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="235" width="126" height="14" rx="7" class="apple"/>
  <text x="462" y="247" class="value">25.28</text>

  <text x="70" y="305" class="metric">BLEU</text>
  <rect x="150" y="287" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="287" width="78" height="14" rx="7" class="base"/>
  <text x="462" y="299" class="value">9.14</text>
  <rect x="150" y="311" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="311" width="83" height="14" rx="7" class="mimi"/>
  <text x="462" y="323" class="value">9.63</text>
  <rect x="150" y="335" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="335" width="55" height="14" rx="7" class="apple"/>
  <text x="462" y="347" class="value">6.40</text>

  <text x="70" y="405" class="metric">COMET-22</text>
  <rect x="150" y="387" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="387" width="223" height="14" rx="7" class="base"/>
  <text x="462" y="399" class="value">0.8486</text>
  <rect x="150" y="411" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="411" width="250" height="14" rx="7" class="mimi"/>
  <text x="462" y="423" class="value">0.8669</text>
  <rect x="150" y="435" width="300" height="14" rx="7" class="track"/>
  <rect x="150" y="435" width="259" height="14" rx="7" class="apple"/>
  <text x="462" y="447" class="value">0.8728</text>

  <text x="70" y="505" class="note">Mimi vs base ElanMT COMET: +0.0183</text>
  <text x="70" y="535" class="small">Mimi vs Apple Translation: -0.0060, interval crosses zero</text>
  <text x="70" y="566" class="small">Higher quality score is better</text>

  <text x="638" y="205" class="metric">chrF++</text>
  <rect x="718" y="187" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="187" width="250" height="14" rx="7" class="base"/>
  <text x="1030" y="199" class="value">50.06</text>
  <rect x="718" y="211" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="211" width="276" height="14" rx="7" class="mimi"/>
  <text x="1030" y="223" class="value">55.19</text>
  <rect x="718" y="235" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="235" width="271" height="14" rx="7" class="apple"/>
  <text x="1030" y="247" class="value">54.29</text>

  <text x="638" y="305" class="metric">BLEU</text>
  <rect x="718" y="287" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="287" width="221" height="14" rx="7" class="base"/>
  <text x="1030" y="299" class="value">25.77</text>
  <rect x="718" y="311" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="311" width="262" height="14" rx="7" class="mimi"/>
  <text x="1030" y="323" class="value">30.62</text>
  <rect x="718" y="335" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="335" width="257" height="14" rx="7" class="apple"/>
  <text x="1030" y="347" class="value">29.97</text>

  <text x="638" y="405" class="metric">COMET-22</text>
  <rect x="718" y="387" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="387" width="124" height="14" rx="7" class="base"/>
  <text x="1030" y="399" class="value">0.7825</text>
  <rect x="718" y="411" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="411" width="179" height="14" rx="7" class="mimi"/>
  <text x="1030" y="423" class="value">0.8192</text>
  <rect x="718" y="435" width="300" height="14" rx="7" class="track"/>
  <rect x="718" y="435" width="181" height="14" rx="7" class="apple"/>
  <text x="1030" y="447" class="value">0.8208</text>

  <text x="638" y="505" class="note">Mimi vs base ElanMT COMET: +0.0367</text>
  <text x="638" y="535" class="small">Mimi vs Apple Translation: -0.0016, interval crosses zero</text>
  <text x="638" y="566" class="small">Higher quality score is better</text>

  <g filter="url(#shadow)">
    <rect x="42" y="620" width="280" height="200" rx="22" class="card"/>
    <rect x="342" y="620" width="816" height="200" rx="22" class="card"/>
  </g>
  <text x="70" y="660" class="direction">Size and architecture</text>
  <text x="70" y="696" class="note">73.43 MB total</text>
  <text x="70" y="723" class="small">Below the 150 MB target</text>
  <text x="70" y="750" class="small">Two Marian 6+6 specialists</text>
  <text x="70" y="777" class="small">4-bit MLX, one app interface</text>
  <text x="70" y="804" class="small">Mimi peak RSS: 213.7 MB</text>

  <text x="370" y="658" class="direction">Single-pass segment latency</text>
  <text x="370" y="681" class="small">p95 bars use a shared log scale from 1 to 3,000 ms; labels show p50 / p95</text>
  <line x1="750" y1="693" x2="750" y2="787" stroke="#263653" stroke-width="1"/>

  <text x="370" y="707" class="metric">English → Japanese</text>
  <text x="615" y="707" class="label">p50 / p95</text>
  <text x="370" y="730" class="label">Base</text>
  <rect x="440" y="719" width="165" height="10" rx="5" class="track"/>
  <rect x="440" y="719" width="93" height="10" rx="5" class="base"/>
  <text x="615" y="730" class="value">40 / 92 ms</text>
  <text x="370" y="754" class="label">Mimi</text>
  <rect x="440" y="743" width="165" height="10" rx="5" class="track"/>
  <rect x="440" y="743" width="92" height="10" rx="5" class="mimi"/>
  <text x="615" y="754" class="value">42 / 88 ms</text>
  <text x="370" y="778" class="label">Apple</text>
  <rect x="440" y="767" width="165" height="10" rx="5" class="track"/>
  <rect x="440" y="767" width="165" height="10" rx="5" class="apple"/>
  <text x="615" y="778" class="value">1,581 / 2,925 ms</text>

  <text x="770" y="707" class="metric">Japanese → English</text>
  <text x="1015" y="707" class="label">p50 / p95</text>
  <text x="770" y="730" class="label">Base</text>
  <rect x="840" y="719" width="165" height="10" rx="5" class="track"/>
  <rect x="840" y="719" width="97" height="10" rx="5" class="base"/>
  <text x="1015" y="730" class="value">46 / 109 ms</text>
  <text x="770" y="754" class="label">Mimi</text>
  <rect x="840" y="743" width="165" height="10" rx="5" class="track"/>
  <rect x="840" y="743" width="104" height="10" rx="5" class="mimi"/>
  <text x="1015" y="754" class="value">58 / 155 ms</text>
  <text x="770" y="778" class="label">Apple</text>
  <rect x="840" y="767" width="165" height="10" rx="5" class="track"/>
  <rect x="840" y="767" width="162" height="10" rx="5" class="apple"/>
  <text x="1015" y="778" class="value">1,626 / 2,558 ms</text>

  <text x="370" y="806" class="note">Mimi p95 speedup vs Apple Translation: 33.1× EN→JA, 16.5× JA→EN</text>
</svg>
