<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="title description">
  <title id="title">Base ElanMT, Mimi, and Apple Translation comparison</title>
  <desc id="description">Mimi improves over base ElanMT in both translation directions, is statistically tied with Apple Translation on COMET-22, and has much lower segment latency.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --text: #172033;
      --muted: #667085;
      --grid: #d0d5dd;
      --base: #14b8a6;
      --apple: #98a2b3;
      --mimi: #7c3aed;
      --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f4f7;
        --muted: #b9c0cc;
        --grid: #475467;
        --base: #5eead4;
        --apple: #98a2b3;
        --mimi: #a78bfa;
        --surface: #0d1117;
      }
    }
    text {
      fill: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .small { fill: var(--muted); font-size: 12px; }
    .heading { font-size: 15px; font-weight: 600; }
    .value { font-weight: 600; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .base { fill: var(--base); }
    .apple { fill: var(--apple); }
    .mimi { fill: var(--mimi); }
    .panel { fill: var(--surface); }
  </style>

  <rect class="panel" width="900" height="625" rx="12"/>

  <circle class="base" cx="30" cy="28" r="6"/>
  <text x="42" y="33">Base ElanMT</text>
  <circle class="mimi" cx="150" cy="28" r="6"/>
  <text x="162" y="33">Mimi</text>
  <circle class="apple" cx="226" cy="28" r="6"/>
  <text x="238" y="33">Apple Translation</text>
  <text class="small" x="870" y="33" text-anchor="end">Quality: higher is better</text>

  <g transform="translate(20 64)">
    <text class="heading" x="0" y="0">English → Japanese</text>
    <text class="small" x="0" y="20">100 public segments, including long-document slices</text>

    <text class="value" x="0" y="51">chrF++</text>
    <line class="grid" x1="80" y1="40" x2="350" y2="40"/>
    <text class="small" x="80" y="55" text-anchor="middle">0</text>
    <text class="small" x="350" y="55" text-anchor="middle">60</text>
    <text x="0" y="78">Base</text>
    <rect class="base" x="80" y="63" width="126.6" height="20" rx="4"/>
    <text class="value" x="356" y="78">28.13</text>
    <text x="0" y="103">Mimi</text>
    <rect class="mimi" x="80" y="88" width="127.8" height="20" rx="4"/>
    <text class="value" x="356" y="103">28.41</text>
    <text x="0" y="128">Apple</text>
    <rect class="apple" x="80" y="113" width="113.8" height="20" rx="4"/>
    <text class="value" x="356" y="128">25.28</text>

    <text class="value" x="0" y="164">BLEU</text>
    <line class="grid" x1="80" y1="153" x2="350" y2="153"/>
    <text class="small" x="80" y="168" text-anchor="middle">0</text>
    <text class="small" x="350" y="168" text-anchor="middle">35</text>
    <text x="0" y="191">Base</text>
    <rect class="base" x="80" y="176" width="70.5" height="20" rx="4"/>
    <text class="value" x="356" y="191">9.14</text>
    <text x="0" y="216">Mimi</text>
    <rect class="mimi" x="80" y="201" width="74.3" height="20" rx="4"/>
    <text class="value" x="356" y="216">9.63</text>
    <text x="0" y="241">Apple</text>
    <rect class="apple" x="80" y="226" width="49.4" height="20" rx="4"/>
    <text class="value" x="356" y="241">6.40</text>

    <text class="value" x="0" y="277">COMET-22</text>
    <line class="grid" x1="80" y1="266" x2="350" y2="266"/>
    <text class="small" x="80" y="281" text-anchor="middle">0</text>
    <text class="small" x="350" y="281" text-anchor="middle">0.9</text>
    <text x="0" y="304">Base</text>
    <rect class="base" x="80" y="289" width="254.6" height="20" rx="4"/>
    <text class="value" x="356" y="304">0.8486</text>
    <text x="0" y="329">Mimi</text>
    <rect class="mimi" x="80" y="314" width="260.1" height="20" rx="4"/>
    <text class="value" x="356" y="329">0.8669</text>
    <text x="0" y="354">Apple</text>
    <rect class="apple" x="80" y="339" width="261.8" height="20" rx="4"/>
    <text class="value" x="356" y="354">0.8728</text>
  </g>

  <g transform="translate(460 64)">
    <text class="heading" x="0" y="0">Japanese → English</text>
    <text class="small" x="0" y="20">100 public segments, including long-document slices</text>

    <text class="value" x="0" y="51">chrF++</text>
    <line class="grid" x1="80" y1="40" x2="350" y2="40"/>
    <text class="small" x="80" y="55" text-anchor="middle">0</text>
    <text class="small" x="350" y="55" text-anchor="middle">60</text>
    <text x="0" y="78">Base</text>
    <rect class="base" x="80" y="63" width="225.3" height="20" rx="4"/>
    <text class="value" x="356" y="78">50.06</text>
    <text x="0" y="103">Mimi</text>
    <rect class="mimi" x="80" y="88" width="248.4" height="20" rx="4"/>
    <text class="value" x="356" y="103">55.19</text>
    <text x="0" y="128">Apple</text>
    <rect class="apple" x="80" y="113" width="244.3" height="20" rx="4"/>
    <text class="value" x="356" y="128">54.29</text>

    <text class="value" x="0" y="164">BLEU</text>
    <line class="grid" x1="80" y1="153" x2="350" y2="153"/>
    <text class="small" x="80" y="168" text-anchor="middle">0</text>
    <text class="small" x="350" y="168" text-anchor="middle">35</text>
    <text x="0" y="191">Base</text>
    <rect class="base" x="80" y="176" width="198.8" height="20" rx="4"/>
    <text class="value" x="356" y="191">25.77</text>
    <text x="0" y="216">Mimi</text>
    <rect class="mimi" x="80" y="201" width="236.2" height="20" rx="4"/>
    <text class="value" x="356" y="216">30.62</text>
    <text x="0" y="241">Apple</text>
    <rect class="apple" x="80" y="226" width="231.2" height="20" rx="4"/>
    <text class="value" x="356" y="241">29.97</text>

    <text class="value" x="0" y="277">COMET-22</text>
    <line class="grid" x1="80" y1="266" x2="350" y2="266"/>
    <text class="small" x="80" y="281" text-anchor="middle">0</text>
    <text class="small" x="350" y="281" text-anchor="middle">0.9</text>
    <text x="0" y="304">Base</text>
    <rect class="base" x="80" y="289" width="234.8" height="20" rx="4"/>
    <text class="value" x="356" y="304">0.7825</text>
    <text x="0" y="329">Mimi</text>
    <rect class="mimi" x="80" y="314" width="245.8" height="20" rx="4"/>
    <text class="value" x="356" y="329">0.8192</text>
    <text x="0" y="354">Apple</text>
    <rect class="apple" x="80" y="339" width="246.2" height="20" rx="4"/>
    <text class="value" x="356" y="354">0.8208</text>
  </g>

  <g transform="translate(20 452)">
    <text class="heading" x="0" y="0">English → Japanese latency</text>
    <text class="small" x="0" y="20">p95 bar, p50 / p95 label</text>
    <line class="grid" x1="80" y1="38" x2="350" y2="38"/>
    <text class="small" x="80" y="53" text-anchor="middle">0 ms</text>
    <text class="small" x="350" y="53" text-anchor="middle">3,000 ms</text>
    <text x="0" y="77">Base</text>
    <rect class="base" x="80" y="62" width="8.3" height="20" rx="4"/>
    <text class="value" x="410" y="77" text-anchor="end">40 / 92 ms</text>
    <text x="0" y="102">Mimi</text>
    <rect class="mimi" x="80" y="87" width="7.9" height="20" rx="4"/>
    <text class="value" x="410" y="102" text-anchor="end">42 / 88 ms</text>
    <text x="0" y="127">Apple</text>
    <rect class="apple" x="80" y="112" width="263.3" height="20" rx="4"/>
    <text class="value" x="410" y="127" text-anchor="end">1,581 / 2,925 ms</text>
  </g>

  <g transform="translate(460 452)">
    <text class="heading" x="0" y="0">Japanese → English latency</text>
    <text class="small" x="0" y="20">p95 bar, p50 / p95 label</text>
    <line class="grid" x1="80" y1="38" x2="350" y2="38"/>
    <text class="small" x="80" y="53" text-anchor="middle">0 ms</text>
    <text class="small" x="350" y="53" text-anchor="middle">3,000 ms</text>
    <text x="0" y="77">Base</text>
    <rect class="base" x="80" y="62" width="9.8" height="20" rx="4"/>
    <text class="value" x="410" y="77" text-anchor="end">46 / 109 ms</text>
    <text x="0" y="102">Mimi</text>
    <rect class="mimi" x="80" y="87" width="14.0" height="20" rx="4"/>
    <text class="value" x="410" y="102" text-anchor="end">58 / 155 ms</text>
    <text x="0" y="127">Apple</text>
    <rect class="apple" x="80" y="112" width="230.2" height="20" rx="4"/>
    <text class="value" x="410" y="127" text-anchor="end">1,626 / 2,558 ms</text>
  </g>

  <text class="small" x="24" y="607">Mimi pack: 73.43 MB. Peak RSS: 213.7 MB. COMET-22 difference vs Apple is not statistically resolved in either direction.</text>
</svg>
