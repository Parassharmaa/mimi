<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title description">
  <title id="title">Apple SpeechAnalyzer and Mimi Speech Preview comparison</title>
  <desc id="description">Mimi has lower Japanese character error rate and English word error rate. Apple remains faster to first text. Mimi's correctly paced production queue drops no audio, but finalization still exceeds the promotion target.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --text: #172033;
      --muted: #667085;
      --grid: #d0d5dd;
      --apple: #98a2b3;
      --mimi: #7c3aed;
      --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f2f4f7;
        --muted: #b9c0cc;
        --grid: #475467;
        --apple: #98a2b3;
        --mimi: #a78bfa;
        --surface: #0d1117;
      }
    }
    text {
      fill: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .small { fill: var(--muted); font-size: 12px; }
    .heading { font-size: 15px; font-weight: 600; }
    .value { font-weight: 600; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .apple { fill: var(--apple); }
    .mimi { fill: var(--mimi); }
    .panel { fill: var(--surface); }
  </style>

  <rect class="panel" width="900" height="360" rx="12"/>

  <circle class="apple" cx="30" cy="28" r="6"/>
  <text x="42" y="33">Apple SpeechAnalyzer progressive</text>
  <circle class="mimi" cx="284" cy="28" r="6"/>
  <text x="296" y="33">Mimi Speech Preview</text>
  <text class="small" x="870" y="33" text-anchor="end">Lower is better</text>

  <g transform="translate(20 62)">
    <text class="heading" x="0" y="0">Japanese CER</text>
    <text class="small" x="0" y="20">24 selected FLEURS clips</text>
    <line class="grid" x1="72" y1="42" x2="230" y2="42"/>
    <line class="grid" x1="72" y1="42" x2="72" y2="132"/>
    <text class="small" x="72" y="151" text-anchor="middle">0%</text>
    <text class="small" x="151" y="151" text-anchor="middle">6%</text>
    <text class="small" x="230" y="151" text-anchor="middle">12%</text>
    <text x="0" y="70">Apple</text>
    <rect class="apple" x="72" y="54" width="146" height="22" rx="4"/>
    <text class="value" x="270" y="70" text-anchor="end">11.06%</text>
    <text x="0" y="110">Mimi</text>
    <rect class="mimi" x="72" y="94" width="87" height="22" rx="4"/>
    <text class="value" x="270" y="110" text-anchor="end">6.57%</text>
  </g>

  <g transform="translate(320 62)">
    <text class="heading" x="0" y="0">English WER</text>
    <text class="small" x="0" y="20">24 selected FLEURS clips</text>
    <line class="grid" x1="72" y1="42" x2="230" y2="42"/>
    <line class="grid" x1="72" y1="42" x2="72" y2="132"/>
    <text class="small" x="72" y="151" text-anchor="middle">0%</text>
    <text class="small" x="151" y="151" text-anchor="middle">5%</text>
    <text class="small" x="230" y="151" text-anchor="middle">10%</text>
    <text x="0" y="70">Apple</text>
    <rect class="apple" x="72" y="54" width="146" height="22" rx="4"/>
    <text class="value" x="270" y="70" text-anchor="end">9.23%</text>
    <text x="0" y="110">Mimi</text>
    <rect class="mimi" x="72" y="94" width="88" height="22" rx="4"/>
    <text class="value" x="270" y="110" text-anchor="end">5.54%</text>
  </g>

  <g transform="translate(620 62)">
    <text class="heading" x="0" y="0">First text p50</text>
    <text class="small" x="0" y="20">Paced production queue</text>
    <line class="grid" x1="72" y1="42" x2="230" y2="42"/>
    <line class="grid" x1="72" y1="42" x2="72" y2="192"/>
    <text class="small" x="72" y="211" text-anchor="middle">0 s</text>
    <text class="small" x="151" y="211" text-anchor="middle">2.5 s</text>
    <text class="small" x="230" y="211" text-anchor="middle">5 s</text>
    <text x="0" y="67">JA Apple</text>
    <rect class="apple" x="72" y="51" width="103" height="20" rx="4"/>
    <text class="value" x="270" y="67" text-anchor="end">3.27 s</text>
    <text x="0" y="100">JA Mimi</text>
    <rect class="mimi" x="72" y="84" width="123" height="20" rx="4"/>
    <text class="value" x="270" y="100" text-anchor="end">3.88 s</text>
    <text x="0" y="145">EN Apple</text>
    <rect class="apple" x="72" y="129" width="70" height="20" rx="4"/>
    <text class="value" x="270" y="145" text-anchor="end">2.23 s</text>
    <text x="0" y="178">EN Mimi</text>
    <rect class="mimi" x="72" y="162" width="91" height="20" rx="4"/>
    <text class="value" x="270" y="178" text-anchor="end">2.88 s</text>
  </g>

  <text class="small" x="24" y="335">Mimi queue: 0 drops / 48 clips. Wake ≤ 9.7 ms. Final p95: 2.12 s JA / 1.73 s EN. Compute RTF: 0.397 JA / 0.405 EN.</text>
</svg>
